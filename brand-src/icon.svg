<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3184d6"/>
      <stop offset="100%" stop-color="#17457a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd766"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="90" cy="76" r="29" fill="url(#sun)"/>

  <!-- cloud: overlapping circles on a rounded base -->
  <g fill="#f7fbff">
    <circle cx="112" cy="118" r="26"/>
    <circle cx="150" cy="100" r="36"/>
    <circle cx="188" cy="120" r="24"/>
    <rect x="112" y="118" width="76" height="26" rx="13"/>
  </g>

  <!-- forecast / air-quality series -->
  <g fill="#93d2ff">
    <rect x="46" y="196" width="24" height="26" rx="8"/>
    <rect x="84" y="184" width="24" height="38" rx="8"/>
    <rect x="122" y="190" width="24" height="32" rx="8"/>
    <rect x="160" y="174" width="24" height="48" rx="8"/>
  </g>
  <rect x="198" y="164" width="24" height="58" rx="8" fill="#ffd766"/>
</svg>
